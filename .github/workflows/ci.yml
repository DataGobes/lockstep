name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest==9.1.1 ruff==0.17.2
      - name: Lint
        run: |
          ruff check core
          ruff format --check core
          ruff check --line-length 120 plugins/lockstep-* tools examples
          ruff format --check --line-length 120 plugins/lockstep-* tools examples
      # Lockstep builds itself the Lockstep way: a PR into a feature branch carries the spec's new tests, red on
      # purpose until the implementation lands. Those files run as a report; every other test must pass, and the PR
      # from the feature branch into main runs everything with nothing excused.
      - name: Tests
        env:
          TARGET: ${{ github.base_ref }}
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name "Lockstep CI"
          red=$(PYTHONPATH=core/src python -m lockstep_checks.red_phase --target "$TARGET")
          ignore=()
          for f in $red; do ignore+=("--ignore=$f"); done
          python -m pytest -q "${ignore[@]}" core/tests plugins/lockstep-core plugins/lockstep-data plugins/lockstep-ai plugins/lockstep-seed tools/tests
          if [ -n "$red" ]; then
            echo "Expected red until the implementation lands:"
            python -m pytest -q $red || true
          fi
      - name: Release metadata
        run: python tools/check_release.py

  validate-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate the marketplace and every plugin
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.310 plugin validate --strict .
          for p in plugins/*/; do npx --yes @anthropic-ai/claude-code@2.1.310 plugin validate --strict "$p"; done
