name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest==9.1.1 ruff==0.17.2
      - name: Lint
        run: |
          ruff check core
          ruff format --check core
          ruff check --line-length 120 plugins/lockstep-* tools
          ruff format --check --line-length 120 plugins/lockstep-* tools
      - name: Tests
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name "Lockstep CI"
          python -m pytest -q core/tests plugins/lockstep-core plugins/lockstep-data plugins/lockstep-ai tools/tests
      - name: Release metadata
        run: python tools/check_release.py

  validate-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate the marketplace and every plugin
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.310 plugin validate --strict .
          for p in plugins/*/; do npx --yes @anthropic-ai/claude-code@2.1.310 plugin validate --strict "$p"; done
