# PR pipeline for the Lockstep repo itself. Create a pipeline from it, then add it to main's and feature/*'s branch
# policies as a required Build validation. Azure Repos ignores the `pr:` key, so the branch policy is what runs it.
#
# Lockstep has no root pyproject.toml or uv.lock, so the template's quality and mutation jobs (which start with
# `uv sync`) don't fit. The tests job below runs what .github/workflows/ci.yml runs, with the same pinned tools, and
# publishes evidence the way the quality template does, so the summary comment still shows tests and coverage.
#
# The summary stage runs after the checks stage whether its jobs passed or failed, and posts one Lockstep summary
# comment on the PR from the evidence the jobs published (see docs/trust-summary.md). The build service needs
# "Contribute to pull requests" on the repository for that; it never fails the PR.

trigger: none

pool:
  vmImage: ubuntu-latest

stages:
  - stage: checks
    displayName: Checks
    jobs:
      - job: lockstep
        displayName: Lockstep checks
        timeoutInMinutes: 10
        steps:
          - template: .lockstep/pipelines/lockstep-pr.yml

      - job: tests
        displayName: Lint, tests and coverage
        timeoutInMinutes: 30
        steps:
          # diff-cover and red_phase compare with the target branch, so they need full history.
          - checkout: self
            fetchDepth: 0
            fetchTags: false

          - task: UsePythonVersion@0
            displayName: "Tests: use Python 3.11"
            inputs:
              versionSpec: "3.11"

          - script: python -m pip install --quiet pytest==9.1.1 ruff==0.17.2 pytest-cov==7.1.0 diff-cover==11.0.0
            displayName: "Tests: install the pinned tools"

          - script: |
              ruff check core
              ruff format --check core
              ruff check --line-length 120 plugins/lockstep-* tools
              ruff format --check --line-length 120 plugins/lockstep-* tools
            displayName: "Tests: ruff"

          # A PR into a feature branch carries the spec's tests red on purpose: the test files the feature branch adds
          # compared with main run as a report, and changed-line coverage is a warning. The PR into main runs all.
          - script: |
              base="origin/${SYSTEM_PULLREQUEST_TARGETBRANCH#refs/heads/}"
              [ "$base" = "origin/" ] && base=origin/main
              git config --global user.email ci@example.invalid
              git config --global user.name "Lockstep CI"
              red=$(python -m lockstep_checks.red_phase) || exit 1
              ignore=()
              for f in $red; do ignore+=("--ignore=$f"); done
              status=0
              python -m pytest -q -p lockstep_checks.pytest_evidence "${ignore[@]}" \
                --cov=core/src --cov=plugins --cov=tools --cov-report=xml:coverage.xml --junitxml=test-results.xml \
                core/tests plugins/lockstep-core plugins/lockstep-data plugins/lockstep-ai tools/tests || status=1
              if [ -n "$red" ]; then
                echo "Red on purpose until the feature branch is implemented (report only):"
                python -m pytest -q -p lockstep_checks.pytest_evidence -p no:cacheprovider $red \
                  || echo "##vso[task.logissue type=warning]Spec tests still red in this PR into a feature branch; expected until the implementation is done"
                diff-cover coverage.xml --compare-branch="$base" --fail-under=80 --json-report diff-cover.json \
                  || echo "##vso[task.logissue type=warning]Coverage of changed lines below 80%; enforced on the PR into main"
              else
                diff-cover coverage.xml --compare-branch="$base" --fail-under=80 --json-report diff-cover.json || status=1
              fi
              python -m lockstep_checks.evidence coverage --report diff-cover.json --minimum 80
              python tools/check_release.py || status=1
              exit $status
            displayName: "Tests: pytest, coverage of changed lines (80%) and release metadata"
            condition: succeededOrFailed()
            env:
              # core/src, not the vendored .lockstep/src: the evidence plugin loads before the tests, and the core
              # tests must import the source they test, not the copy pinned to the last release.
              PYTHONPATH: $(Build.SourcesDirectory)/core/src
              LOCKSTEP_EVIDENCE_DIR: $(Build.ArtifactStagingDirectory)/lockstep-evidence

          - publish: $(Build.ArtifactStagingDirectory)/lockstep-evidence
            artifact: lockstep-evidence-$(System.JobName)
            displayName: "Tests: publish evidence for the summary"
            condition: always()
            continueOnError: true

          - task: PublishTestResults@2
            displayName: "Tests: publish test results"
            condition: succeededOrFailed()
            inputs:
              testResultsFiles: test-results.xml
              failTaskOnMissingResultsFile: false

  - stage: summary
    displayName: Lockstep summary
    dependsOn: checks
    condition: always()
    jobs:
      - job: summary
        displayName: Lockstep summary on the PR
        timeoutInMinutes: 10
        steps:
          - template: .lockstep/pipelines/trust-summary.yml
