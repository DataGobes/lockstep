# Lockstep eval gate for the ai track: run the repo's evals when a PR touches prompts, LLM code or evals. A steps template.
#
#   steps:
#     - template: .lockstep/pipelines/eval-gate.yml
#       parameters:
#         command: uv run python -m evals.run --thresholds evals/thresholds.yml
#         paths: ^(prompts/|src/assistant/|evals/)
#
# The command must exit non-zero when a score is below its threshold in evals/thresholds.yml (for example a script
# around mlflow.genai.evaluate). Other PRs skip the evals, which keeps cost and run time down.

parameters:
  - name: command
    displayName: Command that runs the evals and fails below a threshold
    type: string
  - name: paths
    displayName: Extended regex of changed paths that trigger the evals
    type: string
    default: ^(prompts/|evals/)
  - name: pythonVersion
    type: string
    default: "3.11"

steps:
  - checkout: self
    fetchDepth: 0
    fetchTags: false

  - script: |
      base="origin/${SYSTEM_PULLREQUEST_TARGETBRANCH#refs/heads/}"
      [ "$base" = "origin/" ] && base=origin/main
      if git diff --name-only "$base...HEAD" | grep -Eq "$LOCKSTEP_EVAL_PATHS"; then
        echo "##vso[task.setvariable variable=LOCKSTEP_RUN_EVALS]true"
      else
        echo "Evals: no change matches $LOCKSTEP_EVAL_PATHS, skipping"
      fi
    displayName: "Evals: does this PR need them?"
    env:
      LOCKSTEP_EVAL_PATHS: ${{ parameters.paths }}

  - task: UsePythonVersion@0
    condition: and(succeeded(), eq(variables.LOCKSTEP_RUN_EVALS, 'true'))
    inputs:
      versionSpec: ${{ parameters.pythonVersion }}

  - script: |
      python -m pip install --quiet uv
      uv sync --frozen --all-extras
      ${{ parameters.command }}
    displayName: "Evals: run against thresholds"
    condition: and(succeeded(), eq(variables.LOCKSTEP_RUN_EVALS, 'true'))
