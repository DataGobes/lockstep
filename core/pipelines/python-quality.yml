# Lockstep quality gates for a Python repo managed with uv: a steps template.
#
#   steps:
#     - template: .lockstep/pipelines/python-quality.yml
#       parameters: { coverage: 80, sourceDir: src }
#
# Runs, in order, each as its own step so every failure shows: pre-commit on the changed files (ruff, ruff-format,
# sqlfluff, yamllint, gitleaks: whatever the repo's .pre-commit-config.yaml has), pyright, pytest with diff-cover on
# the changed lines, pip-audit and Bandit. Set a gate's parameter to false to skip it until the repo is ready for it.
#
# A PR into a feature branch (the test PR, or a stream PR) carries the spec's tests red on purpose: the test files the
# feature branch adds compared with main (lockstep_checks.red_phase) run as a report, and the coverage of changed lines
# is a warning there. Every other test must pass. The PR from the feature branch into main runs the full gate.

parameters:
  - name: lockstepDir
    displayName: Folder that holds the Lockstep core, relative to the repo root
    type: string
    default: .lockstep
  - name: pythonVersion
    type: string
    default: "3.11"
  - name: sourceDir
    displayName: Folder Bandit scans and coverage measures
    type: string
    default: src
  - name: coverage
    displayName: Minimum coverage of changed lines, in percent
    type: number
    default: 80
  - name: preCommit
    type: boolean
    default: true
  - name: pyright
    type: boolean
    default: true
  - name: pipAudit
    type: boolean
    default: true
  - name: bandit
    type: boolean
    default: true

steps:
  - checkout: self
    fetchDepth: 0
    fetchTags: false

  - task: UsePythonVersion@0
    displayName: "Quality: use Python ${{ parameters.pythonVersion }}"
    inputs:
      versionSpec: ${{ parameters.pythonVersion }}

  - script: |
      python -m pip install --quiet uv
      uv sync --frozen --all-extras
    displayName: "Quality: install the locked dependencies"

  - ${{ if parameters.preCommit }}:
      - script: |
          base="origin/${SYSTEM_PULLREQUEST_TARGETBRANCH#refs/heads/}"
          [ "$base" = "origin/" ] && base=origin/main
          uv run --with pre-commit pre-commit run --show-diff-on-failure --from-ref "$base" --to-ref HEAD
        displayName: "Quality: pre-commit on changed files"
        condition: succeededOrFailed()

  - ${{ if parameters.pyright }}:
      - script: uv run --with pyright pyright
        displayName: "Quality: pyright"
        condition: succeededOrFailed()

  - script: |
      base="origin/${SYSTEM_PULLREQUEST_TARGETBRANCH#refs/heads/}"
      [ "$base" = "origin/" ] && base=origin/main
      red=$(PYTHONPATH="${{ parameters.lockstepDir }}/src" python -m lockstep_checks.red_phase) || exit 1
      ignore=()
      for f in $red; do ignore+=("--ignore=$f"); done
      status=0
      uv run --with pytest-cov --with diff-cover pytest -p lockstep_checks.pytest_evidence "${ignore[@]}" --cov=${{ parameters.sourceDir }} --cov-report=xml --junitxml=test-results.xml || status=1
      if [ -n "$red" ]; then
        echo "Red on purpose until the feature branch is implemented (report only):"
        uv run pytest -p lockstep_checks.pytest_evidence $red -p no:cacheprovider -q || echo "##vso[task.logissue type=warning]Spec tests still red in this PR into a feature branch; expected until the implementation is done"
        uv run --with diff-cover diff-cover coverage.xml --compare-branch="$base" --fail-under=${{ parameters.coverage }} \
          --json-report diff-cover.json || echo "##vso[task.logissue type=warning]Coverage of changed lines below ${{ parameters.coverage }}%; enforced on the PR into main"
      else
        uv run --with diff-cover diff-cover coverage.xml --compare-branch="$base" --fail-under=${{ parameters.coverage }} \
          --json-report diff-cover.json || status=1
      fi
      PYTHONPATH="${{ parameters.lockstepDir }}/src" python -m lockstep_checks.evidence coverage \
        --report diff-cover.json --minimum ${{ parameters.coverage }}
      exit $status
    displayName: "Quality: pytest and coverage of changed lines (${{ parameters.coverage }}%)"
    condition: succeededOrFailed()
    env:
      # The pytest plugin and the evidence writer live in the Lockstep core; the evidence feeds the trust summary.
      PYTHONPATH: $(Build.SourcesDirectory)/${{ parameters.lockstepDir }}/src
      LOCKSTEP_EVIDENCE_DIR: $(Build.ArtifactStagingDirectory)/lockstep-evidence

  - publish: $(Build.ArtifactStagingDirectory)/lockstep-evidence
    artifact: lockstep-evidence-$(System.JobName)
    displayName: "Quality: publish evidence for the summary"
    condition: always()
    continueOnError: true

  - task: PublishTestResults@2
    displayName: "Quality: publish test results"
    condition: succeededOrFailed()
    inputs:
      testResultsFiles: test-results.xml
      failTaskOnMissingResultsFile: false

  - ${{ if parameters.pipAudit }}:
      # pip-audit has no severity filter: it fails on any known vulnerability in the locked dependencies.
      - script: |
          uv export --frozen --no-hashes --format requirements-txt > "$(Agent.TempDirectory)/requirements.txt"
          uvx pip-audit --strict --requirement "$(Agent.TempDirectory)/requirements.txt"
        displayName: "Quality: pip-audit"
        condition: succeededOrFailed()

  - ${{ if parameters.bandit }}:
      - script: uvx bandit --recursive ${{ parameters.sourceDir }} --severity-level high --confidence-level medium
        displayName: "Quality: Bandit (high severity)"
        condition: succeededOrFailed()
