[project]
name = "lockstep-checks"
version = "0.5.0"
description = "Shared core of Lockstep: spec resolution, config and the checks that hooks and CI both run."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["ac(id): acceptance criterion this test covers"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# The hook runner catches everything on purpose: a crashing hook must block, not allow.
"src/lockstep_checks/hooks/__init__.py" = ["BLE001"]
