trigger:
  branches: { include: [main] }
pool: { vmImage: ubuntu-latest }
stages:
  - stage: test
    jobs:
      - job: python
        steps:
          - script: pip install -e .[dev] && ruff check . && pytest -q
      - job: dbt
        steps:
          - script: pip install dbt-databricks sqlfluff && cd dbt && dbt deps && sqlfluff lint models && dbt build --select state:modified+ --defer --state prod-artifacts
