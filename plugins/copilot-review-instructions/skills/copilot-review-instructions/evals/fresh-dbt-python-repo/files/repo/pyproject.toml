[project]
name = "ingest"
version = "0.4.0"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "pydantic-settings>=2.2", "tenacity>=8.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "responses>=0.25"]

[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E", "F", "I", "B", "T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
