id = "protect-secrets"
title = "Agents can't read secrets or raw data samples"
prevents = "An agent reads a secret or real customer data and copies it into code, a prompt or a log."
kind = "mechanical"
cost = "low"
start = "risk"
signals = ["secret_files", "data_samples"]
answers = ["pii"]
failures = ["secret in a commit", "agent read the .env", "customer data in a test fixture"]
review_after_days = 365

[render]
agents_md = ["Use invented values in tests and examples; never copy real customer data, even from a sample file."]
deny = ["Read(./.env)", "Read(./.env.*)", "Read(./secrets/**)", "Read(./data/samples/**)", "Read(./data/raw/**)", "Bash(curl *)"]
