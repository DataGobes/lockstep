# Generated by lockstep-seed: the fixed core's check on every pull request.
# Add it as a build validation policy on main.
trigger: none
pool:
  vmImage: ubuntu-latest
steps:
  - checkout: self
    fetchDepth: 0
  - task: UsePythonVersion@0
    inputs:
      versionSpec: "3.11"
  - script: |
      target="${SYSTEM_PULLREQUEST_TARGETBRANCH#refs/heads/}"
      git fetch origin "$target"
      python3 .workflow/core/check_core.py --base "origin/$target"
    displayName: Fixed core
