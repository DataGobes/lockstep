# Generated by lockstep-seed: the fixed core's check on every pull request.
name: seed-core
on:
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fixed core
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 .workflow/core/check_core.py --base "origin/${{ github.base_ref }}"
