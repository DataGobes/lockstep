status: approved       # draft | approved | tests-locked | implemented
pii: no                # yes = Copilot-only routing
track: mixed           # data | ai | mixed
jira:                  # none: Lockstep's own repo has no Jira project ([jira] required = false)
locked_at_commit:      # commit SHA of the tests, filled at tests-locked (a baseline: at implemented)
design: no             # yes = research.md and design.md before approval (new_spec.py --design adds them)
capability: pr-trust-summary
kind: change           # change | baseline (pins behaviour the code already has; see docs/baseline-specs.md)
