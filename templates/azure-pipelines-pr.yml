# PR pipeline for a Lockstep product repo. Save as azure-pipelines-pr.yml in the repo root,
# create a pipeline from it, then add it to main's branch policy as a required Build validation.
# Azure Repos ignores the `pr:` key, so the branch policy is what runs it on every PR.
#
# Keep the jobs for the repo's tracks and delete the rest (the bootstrap-repo skill does this):
# data track: dbt and bundle; ai track: evals. The Databricks jobs read DATABRICKS_HOST,
# DATABRICKS_HTTP_PATH and DATABRICKS_TOKEN from the variable group below; use a CI service
# principal that has no SELECT on tables with personal data.

trigger: none

pool:
  vmImage: ubuntu-latest

variables:
  - group: lockstep-ci   # create it in Pipelines > Library; mark the token as secret

jobs:
  - job: lockstep
    displayName: Lockstep checks
    timeoutInMinutes: 10
    steps:
      - template: .lockstep/pipelines/lockstep-pr.yml

  - job: quality
    displayName: Lint, types, tests and security
    timeoutInMinutes: 30
    steps:
      - template: .lockstep/pipelines/python-quality.yml
        parameters:
          sourceDir: src
          coverage: 80

  - job: dbt
    displayName: dbt Slim CI
    timeoutInMinutes: 45
    steps:
      - template: .lockstep/pipelines/dbt-slim-ci.yml
        parameters:
          projectDir: .
          deployPipeline: <name of this repo's deploy pipeline>

  - job: bundle
    displayName: Databricks bundle
    timeoutInMinutes: 10
    steps:
      - template: .lockstep/pipelines/bundle-validate.yml
        parameters:
          target: dev

  - job: evals
    displayName: Eval gate
    timeoutInMinutes: 60
    steps:
      - template: .lockstep/pipelines/eval-gate.yml
        parameters:
          command: uv run python -m evals.run --thresholds evals/thresholds.yml
          paths: ^(prompts/|evals/)
