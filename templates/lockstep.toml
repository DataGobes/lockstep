# Lockstep settings for this repo. Every key is optional: delete a line to use
# the default shown. Unknown keys are an error, so a typo never disables a gate.

[lockstep]
core_version = "0.1"   # lockstep-checks version this repo is pinned to
specs_dir = "specs"
# Branch -> spec id. Must capture the id in a group named "id".
branch_pattern = '^(?:feature|bugfix|hotfix|test|spec)/(?P<id>\d{4})-'
tracks = ["data", "ai"]   # remove one if the repo has only one track; "mixed" needs both

[jira]
# Jira project keys; PR titles, branches and specs must use issue keys like MXAAI-123.
projects = ["MXAAI"]
multiple_keys = false   # true lets one PR name several issue keys

[protect]
# Read-only for agents once the active spec is tests-locked. New files stay allowed.
globs = [
  "tests/**",
  "**/*.unit_tests.yml",
  "evals/thresholds.yml",
  "evals/datasets/**",
  "**/__snapshots__/**",
]

[pii]
# Field names the prompt hook treats as personal data.
columns = ["email", "phone", "iban", "first_name", "last_name", "full_name", "date_of_birth", "address"]

[pr_size]
warn_lines = 400
fail_lines = 800
max_files = 100   # Copilot code review's hard limit
ignore = ["target/**", "**/*.lock", "uv.lock", "**/manifest.json"]

[lanes]
# Work that needs no spec. check_spec_required fails any other code change without a tests-locked spec.
chore = ["chore/"]                  # dependency bumps, config, tooling; no behaviour change
bugfix = ["bugfix/", "hotfix/"]     # a bug report and a new regression test, then the fix
bug_reports_dir = "specs/bug-reports"
no_spec_needed = ["specs/**", "docs/**", "**/*.md"]

[enforcement]
# "enforce" blocks. "warn" lets the change through, reports that it would have been blocked, and counts it
# (CI build tags, and the hooks' local log). A pilot starts on warn and switches a check to enforce once the
# numbers support it: see docs/enforcement-modes.md. Without this table every check enforces.
# The guard_bash hook (prod deploys, force-pushes, history rewrites on main) always enforces.
default = "warn"
# One line per check overrides the default:
# protect_tests = "enforce"     # hook: edits to tests that existed before the spec was tests-locked
# test_tamper = "enforce"       # CI: changed, deleted or weakened existing tests
# spec_required = "enforce"     # CI: code changes without a spec at the right status
# ac_traceability = "enforce"   # CI: acceptance criteria without a test
# jira_key = "enforce"          # CI: Jira issue key in the PR title or branch
# pr_size = "enforce"           # CI: PR above fail_lines or max_files
# review_rules = "enforce"      # CI: Copilot review rules in sync with AGENTS.md
